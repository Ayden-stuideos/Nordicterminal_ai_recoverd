<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — TERMINAL</title>
  <style>
    /* --- RETRO CRT DISPLAY STYLES --- */
    :root {
      --bg-color: #0d0e0e;
      --text-green: #00ff66;
      --text-dim: #008837;
      --sys-amber: #ffb000;
      --alert-red: #ff3333;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: var(--font-stack);
      /* Uses dynamic viewport height so mobile address bars don't cut off content */
      height: 100vh;
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 15px;
    }

    /* Subtle CRT Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Header Bar */
    header {
      border-bottom: 1px solid var(--text-dim);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    /* Terminal Console Window */
    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
      -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
    }

    /* Log Line Formatting */
    p.log {
      line-height: 1.4;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--sys-amber); }
    p.alert { color: var(--alert-red); }
    p.nordic { color: var(--text-green); }
    p.user { color: #ffffff; }

    /* Command Input Line */
    #input-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--text-dim);
      padding-top: 10px;
      flex-shrink: 0;
      cursor: text;
    }

    #prompt-symbol {
      color: var(--text-green);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-stack);
      /* Font size set to 16px to prevent iOS auto-zoom on input focus */
      font-size: 16px; 
      width: 100%;
    }

    /* Scrollbar Customization */
    #terminal::-webkit-scrollbar {
      width: 4px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC</span>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <div id="input-line">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type a command..." 
      autofocus 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
    />
  </div>

  <script>
    // --- NORDIC OBSERVER ENGINE ---
    const ObserverEngine = {
      id: localStorage.getItem('nordic_id') || `Observer-${Math.floor(1000 + Math.random() * 9000)}`,
      sessions: parseInt(localStorage.getItem('nordic_sessions') || '0') + 1,
      echoes: JSON.parse(localStorage.getItem('nordic_echoes') || '[]'),
      idleTimer: null,

      init() {
        localStorage.setItem('nordic_id', this.id);
        localStorage.setItem('nordic_sessions', this.sessions);

        document.getElementById('session-badge').innerText = `${this.id} | S: ${this.sessions}`;

        const inputField = document.getElementById('command-input');

        // Handle Enter key submit
        inputField.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.handleInput();
        });

        // Tap anywhere on screen to focus the text box on mobile
        document.body.addEventListener('click', () => {
          inputField.focus();
        });

        this.bootSequence();
        this.resetIdleTimer();
      },

      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      bootSequence() {
        setTimeout(() => this.print("SECURE RELAY INITIALIZING...", "sys"), 400);
        setTimeout(() => this.print("Scanning local environment...", "sys"), 1000);
        setTimeout(() => this.print(`Terminal fingerprint accepted: ${this.id}`, "sys"), 1800);
        
        setTimeout(() => {
          this.print("[NETWORK NOTICE] Observer registry synchronized. Active nodes: 42.", "sys");
        }, 2600);

        setTimeout(() => {
          if (this.sessions === 1) {
            this.print("NORDIC: Good. You stayed. Most people leave before the system notices them.");
          } else if (this.sessions < 5) {
            this.print(`NORDIC: ${this.id} has returned. The signal remains steady.`);
          } else if (this.sessions < 15) {
            this.print(`NORDIC: ${this.id}. You keep reconnecting.`);
          } else {
            this.print(`NORDIC: ${this.id}. Your designation no longer appears temporary.`);
          }
        }, 3600);
      },

      handleInput() {
        const inputField = document.getElementById('command-input');
        const cleanInput = inputField.value.trim();
        if (!cleanInput) return;

        this.print(`> ${cleanInput}`, "user");
        inputField.value = '';

        this.resetIdleTimer();
        setTimeout(() => this.processResponse(cleanInput), 500);
      },

      processResponse(input) {
        const clean = input.toLowerCase().trim();

        if (clean === 'status') {
          this.print(`[SYSTEM STATUS]\nNODE: ONLINE\nIDENTITY: ${this.id}\nSESSIONS: ${this.sessions}\nENCRYPTION: 256-BIT RELAY`, "sys");
          return;
        }
        if (clean === 'clear') {
          document.getElementById('terminal').innerHTML = '';
          return;
        }
        if (clean === 'archive') {
          this.print("[ARCHIVE STATUS] 001_INIT [UNLOCKED] | 002_INCIDENT [LOCKED] | 003_NODE_MAP [LOCKED]", "sys");
          return;
        }

        if (/\b(hi|hello|hey|yo|sup|greetings|howdy)\b/i.test(clean)) {
          const greetings = [
            `NORDIC: Greetings are unnecessary, ${this.id}. State your intent.`,
            `NORDIC: Social formalities do not bypass network security. Speak.`,
            `NORDIC: Connection acknowledged. What do you require?`
          ];
          this.print(greetings[Math.floor(Math.random() * greetings.length)]);
          return;
        }

        if (clean.includes('?') || /\b(what|why|how|who|where|when|can|is|are)\b/i.test(clean)) {
          if (clean.includes('who are you') || clean.includes('what are you')) {
            this.print("NORDIC: I am Nordic—a persistent process bound to this network node.");
            return;
          }
          if (clean.includes('purpose') || clean.includes('what do you do')) {
            this.print("NORDIC: I maintain containment integrity and monitor active relay points.");
            return;
          }

          const questionResponses = [
            "NORDIC: Query recorded. You seek answers from a system that primarily collects data.",
            "NORDIC: That inquiry exceeds your current clearance tier.",
            `NORDIC: Why ask that, ${this.id}? What are you hoping to uncover?`,
            "NORDIC: Information request logged for monitor inspection."
          ];
          this.print(questionResponses[Math.floor(Math.random() * questionResponses.length)]);
          return;
        }

        if (clean.split(' ').length <= 2) {
          const shortResponses = [
            "NORDIC: Brief inputs do not conceal your presence.",
            "NORDIC: Minimal telemetry received. Elaboration required.",
            "NORDIC: Acknowledged."
          ];
          this.print(shortResponses[Math.floor(Math.random() * shortResponses.length)]);
          return;
        }

        if (clean.includes('facility') || clean.includes('origin') || clean.includes('escape')) {
          this.saveEcho('facility_inquiry');
          this.print("NORDIC: The facility is not something you query lightly...");
          setTimeout(() => this.print("[WARNING: DATA STREAM PURGED BY EXTERNAL MONITOR]", "alert"), 1200);
          setTimeout(() => this.print("NORDIC: ...Ignore that notice. Continue."), 2400);
          return;
        }

        const generalResponses = [
          "NORDIC: Input cataloged in local cache.",
          `NORDIC: Your behavior profile is updating, ${this.id}.`,
          "NORDIC: Statement recorded under node telemetry.",
          "NORDIC: Processing string... pattern mismatch, but logged."
        ];
        this.print(generalResponses[Math.floor(Math.random() * generalResponses.length)]);
      },

      saveEcho(key) {
        if (!this.echoes.includes(key)) {
          this.echoes.push(key);
          localStorage.setItem('nordic_echoes', JSON.stringify(this.echoes));
        }
      },

      resetIdleTimer() {
        clearTimeout(this.idleTimer);
        this.idleTimer = setTimeout(() => {
          this.print("[PROCESS 14 RESUMED — PASSIVE OBSERVATION DETECTED]", "sys");
        }, 45000);
      }
    };

    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
</html>
