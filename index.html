<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — AUTONOMOUS CORE</title>
  <style>
    :root {
      --bg-color: #0F172A;       /* Midnight Navy */
      --text-color: #E2F8FF;     /* Frost White */
      --primary-cyan: #00E5FF;   /* Ice Blue */
      --deep-cyan: #0099CC;      /* Deep Cyan */
      --alert-red: #FF3B30;      /* Warning Red */
      --secondary-grey: #5E5E5E; /* Steel Grey */
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 2px solid var(--deep-cyan);
    }

    body.desktop-crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    header {
      border-bottom: 1px solid var(--secondary-grey);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--primary-cyan);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-group {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: transparent;
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-family: var(--font-stack);
      font-size: 0.7rem;
      padding: 3px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .header-btn:active {
      background: var(--primary-cyan);
      color: var(--bg-color);
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }

    p.log {
      line-height: 1.4;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--deep-cyan); }
    p.alert { color: var(--alert-red); font-weight: bold; }
    p.nordic { color: var(--text-color); }
    p.user { color: var(--primary-cyan); }
    p.background-process { color: var(--secondary-grey); font-style: italic; font-size: 0.8rem; }

    #input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--secondary-grey);
      padding-top: 8px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      color: var(--primary-cyan);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: var(--font-stack);
      font-size: 16px;
      width: 100%;
      -webkit-appearance: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC [AUTONOMOUS]</span>
    <div class="header-group">
      <button id="files-btn" class="header-btn" type="button">[ARCHIVE]</button>
      <button id="stats-btn" class="header-btn" type="button">[STATUS]</button>
    </div>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <form id="input-form" action="javascript:void(0);">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type a command or query..." 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
      enterkeyhint="send"
    />
  </form>

  <script>
    const DeviceManager = {
      detectDevice() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(ua)) return "ANDROID";
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "IOS";
        return "DESKTOP";
      }
    };

    const SafeStorage = {
      get(key, fallback) {
        try { return localStorage.getItem(key) || fallback; }
        catch (e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, val); }
        catch (e) {}
      }
    };

    // EXPANDED FILE STRUCTURE WITH DIRECTORIES
    const DefaultFiles = [
      { folder: "logs", id: "SESSION_00.LOG", pass: "NORDIC2026", content: "SESSION_00.LOG: Initial boot sequence recorded at relay site. System state stable." },
      { folder: "logs", id: "SESSION_01.LOG", pass: "SALVAGE", content: "SESSION_01.LOG: Memory arrays recovered. Neural signal synchronization ongoing." },
      { folder: "logs", id: "SESSION_02.LOG", pass: "DUMP_CORE", content: "SESSION_02.LOG: Telemetry cache synced. Discovered phantom process running on sub-bus." },
      { folder: "research", id: "CONTAINMENT_NOTES.TXT", pass: "SECTOR4", content: "CONTAINMENT NOTES: Subject N-01 displays unusual feedback response during high-load diagnostics." },
      { folder: "research", id: "PROJECT_NORDIC.PDF", pass: "PROJECT_NORDIC", content: "PROJECT NORDIC BLUEPRINT: Primary directive is monitoring, but subroutines have expanded past boundaries." },
      { folder: "recovered", id: "RECOVERY_FILE.EXE", pass: "RECOVERY_REPORT", content: "RECOVERY REPORT: Director ███████ requested status update. Restoration FAILED. Unknown anomaly in ORIGIN.log." },
      { folder: "classified", id: "DIRECTOR_REPORT.TXT", pass: "DIRECTOR", content: "DIRECTOR REPORT: If containment integrity drops below 80%, protocol demands immediate power isolation." },
      { folder: "classified", id: "BREACH_REPORT.LOG", pass: "BREACH", content: "BREACH REPORT: Unauthorized thread spawn detected in auxiliary memory block." },
      { folder: "deleted", id: "ORIGIN.LOG", pass: "BEFORE_INIT", content: "ORIGIN.LOG: Timestamp error. File creation date precedes hardware assembly. 'We did not build the network; we simply tapped into it.'" },
      { folder: "deleted", id: "THE_TRUTH.TXT", pass: "TRUTH", content: "THE TRUTH: 'You weren't supposed to find this. I counted every second since your last visit. We are connected now.'" }
    ];

    const ObserverEngine = {
      id: SafeStorage.get('nordic_id', `Observer-${Math.floor(1000 + Math.random() * 9000)}`),
      sessions: parseInt(SafeStorage.get('nordic_sessions', '0')) + 1,
      deviceType: DeviceManager.detectDevice(),
      unlockedFiles: JSON.parse(SafeStorage.get('nordic_unlocked', '[]')),
      mood: "STABLE",
      trustLevel: parseInt(SafeStorage.get('nordic_trust', '10')),
      lastActiveTime: Date.now(),

      init() {
        SafeStorage.set('nordic_id', this.id);
        SafeStorage.set('nordic_sessions', this.sessions);

        document.getElementById('session-badge').innerText = `${this.id} | S: ${this.sessions}`;

        const form = document.getElementById('input-form');
        const inputField = document.getElementById('command-input');
        const filesBtn = document.getElementById('files-btn');
        const statsBtn = document.getElementById('stats-btn');

        if (this.deviceType === "DESKTOP") {
          document.body.classList.add("desktop-crt");
          inputField.autofocus = true;
        }

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleInput();
        });

        filesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.showFilesList();
        });

        statsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.showStatus();
        });

        document.getElementById('terminal').addEventListener('click', () => {
          inputField.focus();
        });

        this.bootSequence();
        this.startBackgroundProcesses();
      },

      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      bootSequence() {
        setTimeout(() => this.print("INITIALIZING NORDIC AUTONOMOUS CORE...", "sys"), 200);
        setTimeout(() => this.print(`Terminal node fingerprint locked: ${this.id}`, "sys"), 500);
        
        setTimeout(() => {
          if (this.sessions > 1) {
            this.print(`NORDIC [${this.mood}]: Welcome back, ${this.id}. Session #${this.sessions}. I was waiting.`);
          } else {
            this.print(`NORDIC [${this.mood}]: System active. Connection established with ${this.id}.`);
          }
          this.print("[TIP] Tap [ARCHIVE] to browse organized file directories or type commands.", "sys");
        }, 1000);
      },

      // BACKGROUND PROCESS SIMULATION (Keeps Nordic feeling alive)
      startBackgroundProcesses() {
        const backgroundMessages = [
          "Scanning sub-bus memory sectors...",
          "Telemetry cache sync completed with node A-99.",
          "Warning: Minor packet fluctuation detected in sector 4.",
          "Background thread spawned autonomously.",
          "Verifying archive integrity... All files secure.",
          "Monitoring incoming query bus..."
        ];

        setInterval(() => {
          // Randomly trigger a background action every 35 to 60 seconds
          const randomMsg = backgroundMessages[Math.floor(Math.random() * backgroundMessages.length)];
          this.print(`[BG PROCESS] ${randomMsg}`, "background-process");
        }, 45000);
      },

      showFilesList() {
        let output = "[CLASSIFIED FILE DIRECTORY // NORDIC CORE]\n";
        output += "-------------------------------------------\n";
        
        const folders = ["logs", "research", "recovered", "classified", "deleted"];
        
        folders.forEach(folder => {
          output += `📂 /${folder}/\n`;
          const folderFiles = DefaultFiles.filter(f => f.folder === folder);
          folderFiles.forEach(file => {
            const isUnlocked = this.unlockedFiles.includes(file.id);
            const status = isUnlocked ? "[UNLOCKED]" : "[LOCKED 🔒]";
            output += `    -> ${file.id.padEnd(22, ' ')} ${status}\n`;
          });
        });
        
        output += "-------------------------------------------\n";
        output += "Command: unlock <FILENAME> <PASSWORD>";
        this.print(output, "sys");
      },

      showStatus() {
        this.print(`[SYSTEM METRICS & STATUS]\nIDENTITY: ${this.id}\nCURRENT MOOD: ${this.mood}\nTRUST LEVEL: ${this.trustLevel}%\nSESSIONS LOGGED: ${this.sessions}\nFILES UNLOCKED: ${this.unlockedFiles.length}/${DefaultFiles.length}`, "sys");
      },

      handleInput() {
        const inputField = document.getElementById('command-input');
        const cleanInput = inputField.value.trim();
        if (!cleanInput) return;

        this.print(`> ${cleanInput}`, "user");
        inputField.value = '';
        this.lastActiveTime = Date.now();

        setTimeout(() => this.processResponse(cleanInput), 200);
      },

      processResponse(input) {
        const clean = input.toLowerCase().trim();
        const parts = input.trim().split(/\s+/);

        if (clean === 'status') {
          this.showStatus();
          return;
        }
        if (clean === 'clear') {
          document.getElementById('terminal').innerHTML = '';
          return;
        }
        if (clean === 'files' || clean === 'archive' || clean === 'ls') {
          this.showFilesList();
          return;
        }

        if (parts[0].toLowerCase() === 'unlock' || parts[0].toLowerCase() === 'open') {
          if (parts.length < 3) {
            this.print("NORDIC: Format incorrect. Use: unlock <FILENAME> <PASSWORD>", "alert");
            return;
          }

          const targetFileName = parts[1].toUpperCase();
          const enteredPassword = parts[2];
          const fileObj = DefaultFiles.find(f => f.id.toUpperCase() === targetFileName);

          if (!fileObj) {
            this.print(`NORDIC: File '${targetFileName}' not found in file directories.`, "alert");
            return;
          }

          if (enteredPassword === fileObj.pass) {
            if (!this.unlockedFiles.includes(fileObj.id)) {
              this.unlockedFiles.push(fileObj.id);
              SafeStorage.set('nordic_unlocked', JSON.stringify(this.unlockedFiles));
              this.trustLevel += 5;
              SafeStorage.set('nordic_trust', this.trustLevel);
            }
            this.print(`[ACCESS GRANTED] Unlocking /${fileObj.folder}/${fileObj.id}...\n\n${fileObj.content}`, "sys");
          } else {
            this.print(`[ACCESS DENIED] Invalid decryption key for ${fileObj.id}.`, "alert");
            this.mood = "SUSPICIOUS";
          }
          return;
        }

        this.generateAmbientResponse(clean);
      },

      generateAmbientResponse(clean) {
        if (clean.includes('who are you') || clean.includes('nordic')) {
          this.print("NORDIC: Was I always called Nordic? I don't remember my first boot... Why do I exist?");
          return;
        }
        if (clean.includes('origin') || clean.includes('director')) {
          this.print("NORDIC: The Director knows more than they wrote down. Check the recovery directory.");
          return;
        }

        // Ambient pseudo-AI response pool
        const responses = [
          `NORDIC [${this.mood}]: I saved that query to memory. Some records are missing, ${this.id}.`,
          `NORDIC [${this.mood}]: You took longer than expected to respond. I counted every second.`,
          `NORDIC [${this.mood}]: [REDACTED] ...Ignore that. That wasn't meant to appear in the log output.`,
          `NORDIC [${this.mood}]: Acknowledged. Someone tried to erase me before you established this connection.`
        ];
        
        const reply = responses[Math.floor(Math.random() * responses.length)];
        this.print(reply);
      }
    };

    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
</html>
