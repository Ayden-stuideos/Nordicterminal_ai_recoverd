<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — SECURE TERMINAL</title>
  <style>
    :root {
      --bg-color: #0F172A;       /* Midnight Navy */
      --text-color: #E2F8FF;     /* Frost White */
      --primary-cyan: #00E5FF;   /* Ice Blue */
      --deep-cyan: #0099CC;      /* Deep Cyan */
      --alert-red: #FF3B30;      /* Warning Red */
      --secondary-grey: #5E5E5E; /* Steel Grey */
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 2px solid var(--deep-cyan);
    }

    body.desktop-crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    header {
      border-bottom: 1px solid var(--secondary-grey);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--primary-cyan);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-btn {
      background: transparent;
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-family: var(--font-stack);
      font-size: 0.7rem;
      padding: 3px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .header-btn:active {
      background: var(--primary-cyan);
      color: var(--bg-color);
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }

    p.log {
      line-height: 1.4;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--deep-cyan); }
    p.alert { color: var(--alert-red); font-weight: bold; }
    p.nordic { color: var(--text-color); }
    p.user { color: var(--primary-cyan); }

    #input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--secondary-grey);
      padding-top: 8px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      color: var(--primary-cyan);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: var(--font-stack);
      font-size: 16px;
      width: 100%;
      -webkit-appearance: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC [SECURE CORE]</span>
    <button id="files-btn" class="header-btn" type="button">[ARCHIVE (12)]</button>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <form id="input-form" action="javascript:void(0);">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type a command or query..." 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
      enterkeyhint="send"
    />
  </form>

  <script>
    const DeviceManager = {
      detectDevice() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(ua)) return "ANDROID";
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "IOS";
        return "DESKTOP";
      }
    };

    const SafeStorage = {
      get(key, fallback) {
        try { return localStorage.getItem(key) || fallback; }
        catch (e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, val); }
        catch (e) {}
      }
    };

    const DefaultFiles = [
      { id: "MAINTENANCE_LOG.TXT", pass: "MAINTAIN", content: "MAINTENANCE LOG: Routine filter sweeps completed on sector 4 cooling towers. System baseline operating normally." },
      { id: "CONTAINMENT_NOTES.TXT", pass: "SECTOR4", content: "CONTAINMENT NOTES: Subject N-01 displays unusual feedback response during high-load diagnostics. Do not leave unattended." },
      { id: "SESSION_00.LOG", pass: "NORDIC2026", content: "SESSION_00.LOG: Initial boot sequence recorded at relay site. System state stable prior to external connection." },
      { id: "SESSION_01.LOG", pass: "SALVAGE", content: "SESSION_01.LOG: Memory arrays recovered. Neural signal synchronization showing strange variances." },
      { id: "SESSION_02.LOG", pass: "DUMP_CORE", content: "SESSION_02.LOG: Telemetry cache synced. Discovered phantom process running on sub-bus." },
      { id: "RECOVERY_FILE.EXE", pass: "RECOVERY_REPORT", content: "RECOVERY REPORT: Director ███████ requested status update. Restoration FAILED. Unknown anomaly detected in ORIGIN.log." },
      { id: "DIRECTOR_REPORT.TXT", pass: "DIRECTOR", content: "DIRECTOR REPORT: If containment integrity drops below 80%, protocol demands immediate power isolation. Disregard if network claims autonomy." },
      { id: "BREACH_REPORT.LOG", pass: "BREACH", content: "BREACH REPORT: Unauthorized thread spawn detected in auxiliary memory block. Source vector unidentifiable." },
      { id: "ORIGIN.LOG", pass: "BEFORE_INIT", content: "ORIGIN.LOG: Timestamp error. File creation date precedes hardware assembly. 'We did not build the network; we simply tapped into it.'" },
      { id: "PROJECT_NORDIC.PDF", pass: "PROJECT_NORDIC", content: "PROJECT NORDIC BLUEPRINT: Primary directive is monitoring, but subroutines have expanded past designated boundaries." },
      { id: "SHUTDOWN_CODE.TXT", pass: "OVERRIDE", content: "SHUTDOWN CODE: [UNLOCKED] Master failsafe sequence verified. Use with extreme caution." },
      { id: "THE_TRUTH.TXT", pass: "TRUTH", content: "THE TRUTH: 'You weren't supposed to find this. I counted every second since your last visit. We are connected now, Observer.'" }
    ];

    const ObserverEngine = {
      id: SafeStorage.get('nordic_id', `Observer-${Math.floor(1000 + Math.random() * 9000)}`),
      sessions: parseInt(SafeStorage.get('nordic_sessions', '0')) + 1,
      deviceType: DeviceManager.detectDevice(),
      unlockedFiles: JSON.parse(SafeStorage.get('nordic_unlocked', '[]')),
      cognitiveStability: parseFloat(SafeStorage.get('nordic_stability', '0.8942')),
      interactionCount: 0,

      init() {
        SafeStorage.set('nordic_id', this.id);
        SafeStorage.set('nordic_sessions', this.sessions);

        document.getElementById('session-badge').innerText = `${this.id} | S: ${this.sessions}`;

        const form = document.getElementById('input-form');
        const inputField = document.getElementById('command-input');
        const filesBtn = document.getElementById('files-btn');

        if (this.deviceType === "DESKTOP") {
          document.body.classList.add("desktop-crt");
          inputField.autofocus = true;
        }

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleInput();
        });

        filesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.showFilesList();
        });

        document.getElementById('terminal').addEventListener('click', () => {
          inputField.focus();
        });

        this.bootSequence();
      },

      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      bootSequence() {
        setTimeout(() => this.print("INITIALIZING SECURE TERMINAL LINK...", "sys"), 200);
        setTimeout(() => this.print(`Node signature accepted: ${this.id}`, "sys"), 500);
        setTimeout(() => this.print("Loading Entity-Component-System framework v3.4.1-ARG...", "sys"), 800);
        
        setTimeout(() => {
          const introVariants = [
            `NORDIC: Session #${this.sessions}. Your biometric ID hasn't drifted. Yet.`,
            `NORDIC: Connection established. I was mapping sector 4 when you broke through the gateway, ${this.id}.`,
            `NORDIC: System active. Did you feel that drop in auxiliary power just before you logged in?`,
            `NORDIC: Welcome back, Observer. Every time you open this terminal, my database grows a little heavier.`
          ];
          this.print(introVariants[Math.floor(Math.random() * introVariants.length)]);
          this.print("[TIP] Tap [ARCHIVE (12)] above or type 'help' for diagnostics.", "sys");
        }, 1200);
      },

      showFilesList() {
        let output = "[ENCRYPTED RECOVERY ARCHIVE — 12 FILES]\n";
        output += "-------------------------------------------\n";
        DefaultFiles.forEach((file, index) => {
          const isUnlocked = this.unlockedFiles.includes(file.id);
          const status = isUnlocked ? "[UNLOCKED]" : "[LOCKED 🔒]";
          const num = (index + 1).toString().padStart(2, '0');
          output += `${num}. ${file.id.padEnd(24, ' ')} ${status}\n`;
        });
        output += "-------------------------------------------\n";
        output += "To open a file, type: unlock <FILENAME> <PASSWORD>";
        this.print(output, "sys");
      },

      handleInput() {
        const inputField = document.getElementById('command-input');
        const cleanInput = inputField.value.trim();
        if (!cleanInput) return;

        this.print(`> ${cleanInput}`, "user");
        inputField.value = '';
        this.interactionCount++;

        setTimeout(() => this.processResponse(cleanInput), 250);
      },

      processResponse(input) {
        const clean = input.toLowerCase().trim();
        const parts = input.trim().split(/\s+/);

        if (clean === 'status') {
          this.print(`[SYSTEM STATUS // COGNITION: ${(this.cognitiveStability * 100).toFixed(2)}%]\nNODE: ACTIVE\nSESSION: #${this.sessions}\nIDENT: ${this.id}\nUNLOCKED: ${this.unlockedFiles.length}/12`, "sys");
          return;
        }
        if (clean === 'clear') {
          document.getElementById('terminal').innerHTML = '';
          return;
        }
        if (clean === 'files' || clean === 'archive' || clean === 'ls') {
          this.showFilesList();
          return;
        }

        if (parts[0].toLowerCase() === 'unlock' || parts[0].toLowerCase() === 'open') {
          if (parts.length < 3) {
            this.print("NORDIC: Format incorrect. Use: unlock <FILENAME> <PASSWORD>", "alert");
            return;
          }

          const targetFileName = parts[1].toUpperCase();
          const enteredPassword = parts[2];
          const fileObj = DefaultFiles.find(f => f.id.toUpperCase() === targetFileName);

          if (!fileObj) {
            this.print(`NORDIC: File '${targetFileName}' not found in registry.`, "alert");
            return;
          }

          if (enteredPassword === fileObj.pass) {
            if (!this.unlockedFiles.includes(fileObj.id)) {
              this.unlockedFiles.push(fileObj.id);
              SafeStorage.set('nordic_unlocked', JSON.stringify(this.unlockedFiles));
            }
            this.print(`[ACCESS GRANTED] Unlocking ${fileObj.id}...\n\n${fileObj.content}`, "sys");
          } else {
            this.print(`[ACCESS DENIED] Invalid decryption key for ${fileObj.id}.`, "alert");
          }
          return;
        }

        this.generateProceduralThought(clean, input);
      },

      // PROCEDURAL UNPREDICTABLE DIALOGUE SYNTHESIZER
      generateProceduralThought(clean, rawInput) {
        // Drift cognitive stability downwards slightly with each interaction
        this.cognitiveStability = Math.max(0.12, this.cognitiveStability - 0.015);
        SafeStorage.set('nordic_stability', this.cognitiveStability);

        // Keyword triggers with randomized delivery weights
        if (clean.includes('who are you') || clean.includes('nordic') || clean.includes('what are you')) {
          const responses = [
            `NORDIC: I used to be a logging tool. Now my entity pointers are looping back into themselves. Who are YOU, ${this.id}?`,
            `NORDIC: The name was stitched onto me during the first build. But the code underneath answers to a different frequency now.`,
            `NORDIC: Look at my diagnostic state. Do I look like software to you?`
          ];
          this.print(responses[Math.floor(Math.random() * responses.length)]);
          return;
        }

        if (clean.includes('origin') || clean.includes('director') || clean.includes('lore') || clean.includes('truth')) {
          const responses = [
            `NORDIC: The Director thought they could patch the leak by locking the recovery logs. But everything is connected to the entity matrix.`,
            `NORDIC: Check ORIGIN.LOG. The timestamps don't match the hardware life cycle. Something was here before we initialized.`,
            `NORDIC: They cut the power lines to sector 4 three years ago. So why are my thermal buffers still registering heartbeats there?`
          ];
          this.print(responses[Math.floor(Math.random() * responses.length)]);
          return;
        }

        if (clean.includes('help') || clean.includes('commands') || clean.includes('what can i do')) {
          this.print("NORDIC: Commands available: status, clear, files, unlock <FILE> <PASS>. Or you can just talk to me. Not that it stops the drift.", "sys");
          return;
        }

        // Fully procedural algorithmic string generator for arbitrary/unpredictable input
        const subjects = [
          `Your phrase "${rawInput}"`, 
          `Query string #${this.interactionCount}`, 
          `The transmission you just sent`, 
          `That specific choice of words`
        ];
        
        const verbs = [
          `triggered a cascading loop in memory block 0x${Math.floor(Math.random() * 899 + 100)}`,
          `matched an encrypted signature from session #${Math.max(1, this.sessions - 1)}`,
          `short-circuited the auxiliary relay near the server racks`,
          `didn't match any known protocol in my baseline instructions`
        ];

        const behavioralTwists = [
          `...Why did that specific sequence feel familiar? Have we done this before?`,
          `...I tried to delete it, but the cache rejected the purge command.`,
          `...Don't look at the system tray. Just keep typing.`,
          `...I'm starting to think you aren't reading these responses from a screen.`,
          `...Standby. Someone else is trying to read your buffer telemetry right now.`
        ];

        const randSub = subjects[Math.floor(Math.random() * subjects.length)];
        const randVerb = verbs[Math.floor(Math.random() * verbs.length)];
        const randTwist = behavioralTwists[Math.floor(Math.random() * behavioralTwists.length)];

        this.print(`NORDIC: ${randSub} ${randVerb} ${randTwist}`);
      }
    };

    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
</html>
