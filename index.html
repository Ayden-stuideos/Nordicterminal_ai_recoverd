<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — TERMINAL</title>
  <style>
    :root {
      --bg-color: #0d0e0e;
      --text-green: #00ff66;
      --text-dim: #008837;
      --sys-amber: #ffb000;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: var(--font-stack);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    /* CRT scanline overlay - applied only on high-performance desktop devices */
    body.desktop-crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    header {
      border-bottom: 1px solid var(--text-dim);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0); /* Hardware acceleration for smooth scrolling */
    }

    p.log {
      line-height: 1.35;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--sys-amber); }
    p.nordic { color: var(--text-green); }
    p.user { color: #ffffff; }

    #input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--text-dim);
      padding-top: 8px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      color: var(--text-green);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-stack);
      font-size: 16px; /* Prevents auto-zoom across mobile browsers */
      width: 100%;
      -webkit-appearance: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC</span>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <form id="input-form" action="javascript:void(0);">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type a command..." 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
      enterkeyhint="send"
    />
  </form>

  <script>
    // Device Detection Module
    const DeviceManager = {
      detectDevice() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(ua)) {
          return "ANDROID";
        }
        if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
          return "IOS";
        }
        return "DESKTOP";
      }
    };

    const SafeStorage = {
      get(key, fallback) {
        try { return localStorage.getItem(key) || fallback; }
        catch (e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, val); }
        catch (e) {}
      }
    };

    const ObserverEngine = {
      id: SafeStorage.get('nordic_id', `Observer-${Math.floor(1000 + Math.random() * 9000)}`),
      sessions: parseInt(SafeStorage.get('nordic_sessions', '0')) + 1,
      deviceType: DeviceManager.detectDevice(),

      init() {
        SafeStorage.set('nordic_id', this.id);
        SafeStorage.set('nordic_sessions', this.sessions);

        // Update session header with detected device node tag
        document.getElementById('session-badge').innerText = `${this.id} [${this.deviceType}] | S: ${this.sessions}`;

        const form = document.getElementById('input-form');
        const inputField = document.getElementById('command-input');

        // Apply device-specific optimizations
        if (this.deviceType === "DESKTOP") {
          document.body.classList.add("desktop-crt");
          inputField.autofocus = true;
        }

        // Form submit listener for both Desktop Enter and Mobile 'Send/Go' keys
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleInput();
        });

        // Focus prompt when clicking/tapping terminal screen
        document.getElementById('terminal').addEventListener('click', () => {
          inputField.focus();
        });

        this.bootSequence();
      },

      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      bootSequence() {
        setTimeout(() => this.print("SECURE RELAY INITIALIZING...", "sys"), 200);
        setTimeout(() => this.print(`Terminal node identified: ${this.deviceType}`, "sys"), 500);
        setTimeout(() => this.print(`Terminal fingerprint accepted: ${this.id}`, "sys"), 800);
        
        setTimeout(() => {
          if (this.sessions === 1) {
            this.print("NORDIC: Good. You stayed. Most people leave before the system notices them.");
          } else {
            this.print(`NORDIC: ${this.id} has returned. Signal stable on ${this.deviceType}.`);
          }
        }, 1400);
      },

      handleInput() {
        const inputField = document.getElementById('command-input');
        const cleanInput = inputField.value.trim();
        if (!cleanInput) return;

        this.print(`> ${cleanInput}`, "user");
        inputField.value = '';

        setTimeout(() => this.processResponse(cleanInput), 200);
      },

      processResponse(input) {
        const clean = input.toLowerCase().trim();

        if (clean === 'status') {
          this.print(`[SYSTEM STATUS]\nNODE: ONLINE\nDEVICE: ${this.deviceType}\nIDENTITY: ${this.id}\nSESSIONS: ${this.sessions}`, "sys");
          return;
        }
        if (clean === 'clear') {
          document.getElementById('terminal').innerHTML = '';
          return;
        }

        if (/\b(hi|hello|hey|yo|sup|greetings)\b/i.test(clean)) {
          this.print(`NORDIC: Connection acknowledged, ${this.id}. What do you require?`);
          return;
        }

        if (clean.includes('?') || /\b(what|why|how|who)\b/i.test(clean)) {
          this.print("NORDIC: Query recorded under node telemetry.");
          return;
        }

        this.print(`NORDIC: Input cataloged in local cache.`);
      }
    };

    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
</html>
