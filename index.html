<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — SECURE TERMINAL</title>
  <style>
    :root {
      --bg-color: #0F172A;       /* Midnight Navy */
      --text-color: #E2F8FF;     /* Frost White */
      --primary-cyan: #00E5FF;   /* Ice Blue */
      --deep-cyan: #0099CC;      /* Deep Cyan */
      --alert-red: #FF3B30;      /* Warning Red */
      --secondary-grey: #5E5E5E; /* Steel Grey */
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 2px solid var(--deep-cyan);
    }

    body.desktop-crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    header {
      border-bottom: 1px solid var(--secondary-grey);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--primary-cyan);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-btn {
      background: transparent;
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-family: var(--font-stack);
      font-size: 0.7rem;
      padding: 3px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .header-btn:active {
      background: var(--primary-cyan);
      color: var(--bg-color);
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }

    p.log {
      line-height: 1.4;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--deep-cyan); }
    p.alert { color: var(--alert-red); font-weight: bold; }
    p.nordic { color: var(--text-color); }
    p.user { color: var(--primary-cyan); }

    #input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--secondary-grey);
      padding-top: 8px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      color: var(--primary-cyan);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: var(--font-stack);
      font-size: 16px;
      width: 100%;
      -webkit-appearance: none;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC [SECURE CORE]</span>
    <button id="files-btn" class="header-btn" type="button">[ARCHIVE (12)]</button>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <form id="input-form" action="javascript:void(0);">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type a command or query..." 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
      enterkeyhint="send"
    />
  </form>
