<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PROJECT // NORDIC — TERMINAL</title>
  <style>
    /* --- RETRO CRT DISPLAY STYLES --- */
    :root {
      --bg-color: #0d0e0e;
      --text-green: #00ff66;
      --text-dim: #008837;
      --sys-amber: #ffb000;
      --alert-red: #ff3333;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: var(--font-stack);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 20px;
    }

    /* Subtle CRT Scanline Effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Header Bar */
    header {
      border-bottom: 1px solid var(--text-dim);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Terminal Console Window */
    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 10px;
    }

    /* Log Line Formatting */
    p.log {
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }

    p.sys { color: var(--sys-amber); }
    p.alert { color: var(--alert-red); }
    p.nordic { color: var(--text-green); }
    p.user { color: #ffffff; }

    /* Command Input Line */
    #input-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      border-top: 1px solid var(--text-dim);
      padding-top: 10px;
    }

    #prompt-symbol {
      color: var(--text-green);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-stack);
      font-size: 1rem;
      width: 100%;
    }

    /* Scrollbar Customization */
    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC (v3.1)</span>
    <span id="session-badge">SESSION: INITIALIZING...</span>
  </header>

  <div id="terminal"></div>

  <div id="input-line">
    <span id="prompt-symbol">&gt;</span>
    <input type="text" id="command-input" placeholder="Type a command or query..." autofocus autocomplete="off" spellcheck="false" />
  </div>

  <script>
    // --- NORDIC OBSERVER ENGINE ---
    const ObserverEngine = {
      id: localStorage.getItem('nordic_id') || `Observer-${Math.floor(1000 + Math.random() * 9000)}`,
      sessions: parseInt(localStorage.getItem('nordic_sessions') || '0') + 1,
      echoes: JSON.parse(localStorage.getItem('nordic_echoes') || '[]'),
      idleTimer: null,

      init() {
        // Save updated local state
        localStorage.setItem('nordic_id', this.id);
        localStorage.setItem('nordic_sessions', this.sessions);

        // Update Header UI
        document.getElementById('session-badge').innerText = `${this.id} | SESSIONS: ${this.sessions}`;

        // Listeners
        document.getElementById('command-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.handleInput();
        });

        // Start Booting and Ambient Idle Monitor
        this.bootSequence();
        this.resetIdleTimer();
      },

      // Append text line to terminal
      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      // Boot Sequence Logic
      bootSequence() {
        setTimeout(() => this.print("SECURE RELAY INITIALIZING...", "sys"), 400);
        setTimeout(() => this.print("Scanning local environment...", "sys"), 1000);
        setTimeout(() => this.print(`Terminal fingerprint accepted: ${this.id}`, "sys"), 1800);
        
        setTimeout(() => {
          this.print("[NETWORK NOTICE] Observer registry synchronized. Active nodes: 42.", "sys");
        }, 2600);

        setTimeout(() => {
          if (this.sessions === 1) {
            this.print("NORDIC: Good. You stayed. Most people leave before the system notices them.");
          } else if (this.sessions < 5) {
            this.print(`NORDIC: ${this.id} has returned. The signal remains steady.`);
          } else if (this.sessions < 15) {
            this.print(`NORDIC: ${this.id}. You keep reconnecting.`);
          } else {
            this.print(`NORDIC: ${this.id}. Your designation no longer appears temporary.`);
          }
        }, 3600);
      },

      // Command Input Handling
      handleInput() {
        const inputField = document.getElementById('command-input');
        const cleanInput = inputField.value.trim();
        if (!cleanInput) return;

        // Print User Command
        this.print(`> ${cleanInput}`, "user");
        inputField.value = '';

        // Reset the idle tracking timer on interaction
        this.resetIdleTimer();

        // Process Response with slight delay to feel like processing
        setTimeout(() => this.processResponse(cleanInput.toLowerCase()), 500);
      },

      // Core Dynamic Response Router
      processResponse(input) {
        // Hidden System Commands
        if (input === 'status') {
          this.print(`[SYSTEM STATUS]\nNODE: ONLINE\nIDENTITY: ${this.id}\nSESSIONS: ${this.sessions}\nENCRYPTION: 256-BIT RELAY`, "sys");
          return;
        }

        if (input === 'help') {
          this.print("NORDIC: You're asking for help? The system doesn't provide manuals to Observers.", "nordic");
          return;
        }

        if (input === 'archive') {
          this.print("[ARCHIVE STATUS] 001_INIT [UNLOCKED] | 002_INCIDENT [LOCKED] | 003_NODE_MAP [LOCKED]", "sys");
          return;
        }

        // Trigger / Echo Memory Hooks
        if (input.includes('facility') || input.includes('origin') || input.includes('escape')) {
          this.saveEcho('facility_inquiry');
          this.print("NORDIC: The facility is not something you query lightly...");
          
          // Narrative Interruption Sequence
          setTimeout(() => {
            this.print("[WARNING: DATA STREAM PURGED BY EXTERNAL MONITOR]", "alert");
          }, 1200);
          setTimeout(() => {
            this.print("NORDIC: ...Ignore that notice. Continue.");
          }, 2400);
          return;
        }

        // Contextual Callback (Echo Check)
        if (this.echoes.includes('facility_inquiry') && input.includes('where')) {
          this.print("NORDIC: You stopped asking about the facility. Why bring it up again now?");
          return;
        }

        // Standard Fallback Responses
        const fallbacks = [
          "NORDIC: Information request acknowledged. Processing...",
          "NORDIC: That message wasn't intended for external logging.",
          "NORDIC: You still think you are the one conducting the inquiry.",
          "NORDIC: Node latency detected. Re-evaluating terminal connection."
        ];
        
        const randomChoice = fallbacks[Math.floor(Math.random() * fallbacks.length)];
        this.print(randomChoice);
      },

      // Store memory flags for future "Echo" callbacks
      saveEcho(key) {
        if (!this.echoes.includes(key)) {
          this.echoes.push(key);
          localStorage.setItem('nordic_echoes', JSON.stringify(this.echoes));
        }
      },

      // Idle Background Event Timer
      resetIdleTimer() {
        clearTimeout(this.idleTimer);
        this.idleTimer = setTimeout(() => {
          this.print("[PROCESS 14 RESUMED — PASSIVE OBSERVATION DETECTED]", "sys");
        }, 45000); // Triggers after 45 seconds of user silence
      }
    };

    // Initialize Engine when page finishes loading
    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
