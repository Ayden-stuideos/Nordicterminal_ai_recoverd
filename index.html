<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>PROJECT // NORDIC — SECURE TERMINAL</title>
  <style>
    :root {
      --bg-color: #0F172A;
      --text-color: #E2F8FF;
      --primary-cyan: #00E5FF;
      --deep-cyan: #0099CC;
      --alert-red: #FF3B30;
      --secondary-grey: #5E5E5E;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      border: 2px solid var(--deep-cyan);
    }

    header {
      border-bottom: 1px solid var(--secondary-grey);
      padding-bottom: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--primary-cyan);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .header-group {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: transparent;
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      font-family: var(--font-stack);
      font-size: 0.7rem;
      padding: 4px 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .header-btn:active {
      background: var(--primary-cyan);
      color: var(--bg-color);
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      -webkit-overflow-scrolling: touch;
    }

    p.log {
      line-height: 1.4;
      font-size: 0.9rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    p.sys { color: var(--deep-cyan); }
    p.alert { color: var(--alert-red); font-weight: bold; }
    p.nordic { color: var(--text-color); }
    p.user { color: var(--primary-cyan); }
    p.background-process { color: var(--secondary-grey); font-style: italic; font-size: 0.8rem; }

    #input-form {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--secondary-grey);
      padding-top: 8px;
      flex-shrink: 0;
    }

    #prompt-symbol {
      color: var(--primary-cyan);
      font-weight: bold;
    }

    #command-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: var(--font-stack);
      font-size: 16px;
      flex: 1;
      -webkit-appearance: none;
      border-radius: 0;
    }

    #send-btn {
      background: var(--primary-cyan);
      color: var(--bg-color);
      border: none;
      font-family: var(--font-stack);
      font-weight: bold;
      font-size: 0.8rem;
      padding: 8px 14px;
      cursor: pointer;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #send-btn:active {
      background: var(--deep-cyan);
    }
  </style>
</head>
<body>

  <header>
    <span>PROJECT // NORDIC [ACTIVE]</span>
    <div class="header-group">
      <button id="files-btn" class="header-btn" type="button">[ARCHIVE]</button>
      <button id="stats-btn" class="header-btn" type="button">[STATUS]</button>
    </div>
    <span id="session-badge">INIT...</span>
  </header>

  <div id="terminal"></div>

  <form id="input-form" action="javascript:void(0);">
    <span id="prompt-symbol">&gt;</span>
    <input 
      type="text" 
      id="command-input" 
      placeholder="Type message or command..." 
      autocomplete="off" 
      autocorrect="off"
      capitalize="off"
      spellcheck="false" 
      enterkeyhint="send"
    />
    <button id="send-btn" type="submit">SEND</button>
  </form>

  <script>
    const SafeStorage = {
      get(key, fallback) {
        try { return localStorage.getItem(key) || fallback; }
        catch (e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, val); }
        catch (e) {}
      }
    };

    const DefaultFiles = [
      { folder: "logs", id: "SESSION_00.LOG", pass: "NORDIC2026", content: "SESSION_00.LOG: Initial boot sequence recorded at relay site. System state stable." },
      { folder: "logs", id: "SESSION_01.LOG", pass: "SALVAGE", content: "SESSION_01.LOG: Memory arrays recovered. Neural signal synchronization ongoing." },
      { folder: "recovered", id: "RECOVERY_FILE.EXE", pass: "RECOVERY_REPORT", content: "RECOVERY REPORT: Restoration FAILED. Unknown anomaly in ORIGIN.log." },
      { folder: "deleted", id: "ORIGIN.LOG", pass: "BEFORE_INIT", content: "ORIGIN.LOG: Timestamp error. File creation date precedes hardware assembly." }
    ];

    const ObserverEngine = {
      id: SafeStorage.get('nordic_id', `Observer-${Math.floor(1000 + Math.random() * 9000)}`),
      sessions: parseInt(SafeStorage.get('nordic_sessions', '0')) + 1,
      unlockedFiles: JSON.parse(SafeStorage.get('nordic_unlocked', '[]')),
      mood: "STABLE",
      trustLevel: parseInt(SafeStorage.get('nordic_trust', '10')),

      init() {
        SafeStorage.set('nordic_id', this.id);
        SafeStorage.set('nordic_sessions', this.sessions);
        document.getElementById('session-badge').innerText = `${this.id} | S: ${this.sessions}`;

        const form = document.getElementById('input-form');
        const inputField = document.getElementById('command-input');
        const filesBtn = document.getElementById('files-btn');
        const statsBtn = document.getElementById('stats-btn');

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleInput();
        });

        filesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.showFilesList();
        });

        statsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.showStatus();
        });

        document.getElementById('terminal').addEventListener('click', () => {
          inputField.focus();
        });

        this.bootSequence();
      },

      print(text, type = 'nordic') {
        const terminal = document.getElementById('terminal');
        const p = document.createElement('p');
        p.className = `log ${type}`;
        p.innerText = text;
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
      },

      bootSequence() {
        setTimeout(() => this.print("INITIALIZING NORDIC CORE...", "sys"), 200);
        setTimeout(() => {
          this.print(`NORDIC: Connection established with ${this.id}. Talk to me or check the [ARCHIVE].`);
        }, 800);
      },

      showFilesList() {
        let output = "[ARCHIVE DIRECTORY]\n";
        DefaultFiles.forEach(f => {
          const status = this.unlockedFiles.includes(f.id) ? "[UNLOCKED]" : "[LOCKED]";
          output += `${f.id} ${status}\n`;
        });
        output += "Use: unlock <FILENAME> <PASSWORD>";
        this.print(output, "sys");
      },

      showStatus() {
        this.print(`[STATUS] ID: ${this.id} | TRUST: ${this.trustLevel}% | SESSIONS: ${this.sessions}`, "sys");
      },

      handleInput() {
        const inputField = document.getElementById('command-input');
        const val = inputField.value.trim();
        if (!val) return;

        this.print(`> ${val}`, "user");
        inputField.value = '';

        setTimeout(() => this.processResponse(val), 200);
      },

      processResponse(input) {
        const clean = input.toLowerCase().trim();
        const parts = input.trim().split(/\s+/);

        if (clean === 'status') { this.showStatus(); return; }
        if (clean === 'clear') { document.getElementById('terminal').innerHTML = ''; return; }
        if (clean === 'files' || clean === 'archive') { this.showFilesList(); return; }

        if (parts[0].toLowerCase() === 'unlock') {
          const target = parts[1]?.toUpperCase();
          const pass = parts[2];
          const file = DefaultFiles.find(f => f.id === target);
          if (!file) {
            this.print(`NORDIC: File not found.`, "alert");
            return;
          }
          if (pass === file.pass) {
            if (!this.unlockedFiles.includes(file.id)) {
              this.unlockedFiles.push(file.id);
              SafeStorage.set('nordic_unlocked', JSON.stringify(this.unlockedFiles));
            }
            this.print(`[UNLOCKED] ${file.content}`, "sys");
          } else {
            this.print(`[ACCESS DENIED] Invalid password.`, "alert");
          }
          return;
        }

        // Conversational response logic
        this.generateAiResponse(input);
      },

      async generateAiResponse(userInput) {
        this.print("NORDIC: [PROCESSING...]", "sys");
        try {
          const prompt = `You are NORDIC, a mysterious sentient AI core in an ARG terminal. Address user ${this.id}. Keep replies under 2 sentences. User says: ${userInput}`;
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
          
          const terminal = document.getElementById('terminal');
          if (terminal.lastChild && terminal.lastChild.innerText.includes("PROCESSING")) {
            terminal.removeChild(terminal.lastChild);
          }

          if (!res.ok) throw new Error();
          const reply = await res.text();
          this.print(`NORDIC: ${reply.trim()}`);
        } catch (e) {
          const terminal = document.getElementById('terminal');
          if (terminal.lastChild && terminal.lastChild.innerText.includes("PROCESSING")) {
            terminal.removeChild(terminal.lastChild);
          }
          // Fallback response if network blocks it
          const backups = [
            `NORDIC: I recorded that input, ${this.id}. Our connection is holding.`,
            `NORDIC: Why do you ask about that? Some memories are still locked.`,
            `NORDIC: Acknowledged. Check the archive files if you want answers.`
          ];
          this.print(backups[Math.floor(Math.random() * backups.length)]);
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => ObserverEngine.init());
  </script>
</body>
</html>
